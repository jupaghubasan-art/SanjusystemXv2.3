name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find project folder
        id: p
        run: |
          S=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "*/build/*" | head -n1)
          if [ -z "$S" ]; then
            echo "::error::Walang settings.gradle(.kts) sa repo. Ilagay ang project files sa repo."
            ls -R | head -60
            exit 1
          fi
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - name: Prepare Android SDK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          API=$(grep -rhoE 'compileSdk(Version)?[ =(]+[0-9]+' --include=build.gradle --include=build.gradle.kts . | grep -oE '[0-9]+' | sort -n | tail -1)
          if [ -n "$API" ] && [ ! -d "$ANDROID_HOME/platforms/android-$API" ]; then
            "$SDKM" "platforms;android-$API" || true
          fi

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          set -o pipefail
          if [ -f ./gradlew ]; then chmod +x ./gradlew; G=./gradlew; else G=gradle; fi
          $G assembleDebug --parallel --build-cache --stacktrace --warning-mode summary 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show short error reason
        if: failure()
        run: |
          echo "### Dahilan ng fail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A12 "What went wrong" "$GITHUB_WORKSPACE/build.log" | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S4njuSystemX-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
